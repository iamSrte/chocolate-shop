default_job = "clippy"

[jobs.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets"]
need_stdout = false

[jobs.test]
command = ["cargo", "nextest", "run", "--workspace", "--color", "always"]
need_stdout = true

[jobs.run-api]
command = ["cargo", "run", "-p", "api"]
background = false
need_stdout = true
allow_warnings = true
on_change_strategy = "kill_then_restart"
